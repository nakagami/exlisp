name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - otp: '27.x'
            elixir: '1.18.x'
          - otp: '27.x'
            elixir: '1.19.x'
          - otp: '27.x'
            elixir: '1.20.x'
          - otp: '29.x'
            elixir: '1.20.x'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --force --warnings-as-errors

      - name: Run tests
        run: mix test

  ansi-test:
    name: ANSI tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANSI_TEST_REF: b9536e286dcff1c221c8aa8aa235e45d1cfc4b4b

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27.x'
          elixir-version: '1.18.x'

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-27.x-1.18.x-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-27.x-1.18.x-

      - name: Install dependencies
        run: mix deps.get

      - name: Clone ANSI tests
        run: |
          git init ../ansi-test
          git -C ../ansi-test remote add origin https://github.com/sbcl/ansi-test.git
          git -C ../ansi-test fetch --depth 1 origin "$ANSI_TEST_REF"
          git -C ../ansi-test checkout --detach FETCH_HEAD

      - name: Run ANSI test shard
        run: mix run run_ansi_test.exs
        env:
          ANSI_TEST_DIR: ../ansi-test
          ANSI_TEST_SHARD: ${{ matrix.shard }}
          ANSI_TEST_SHARDS: 8
